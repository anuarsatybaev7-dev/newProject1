<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница с кнопкой-карточкой</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        min-height: 200vh; /* чтобы была возможность прокрутки */
        background-image: url('коноха3.png');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        transition: background-image 0.5s ease; /* плавная смена фона */
    }

    /* Контейнер для вертикального центрирования кнопки */
    .section {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh; /* занимает всю высоту экрана */
        flex-direction: column;
    }

    .card-button {
        width: 200px;
        height: 300px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    .card-button img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .card-button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(0,0,0,0.4);
    }

</style>
</head>
<body>

<div class="section">
    <div class="card-button" id="changeBgButton">
        <img src="итачи.jpg" alt="Нажми на карточку">
    </div>
</div>

<script>
const button = document.getElementById('changeBgButton');

// При клике на карточку меняем фон страницы
button.addEventListener('click', () => {
    document.body.style.backgroundImage = "url('пейнфон.png')";
});
</script>

</body>
</html>
